name: Build Android APK (Cliente PTT)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Instalar versiones FIJAS de Buildozer, Cython y sh
      run: |
        pip3 install --user --upgrade "buildozer==1.5.0"
        pip3 install --user --upgrade "Cython==0.29.36"
        pip3 install --user --upgrade "sh<2.0"

    # ELIMINAMOS EL CACHÉ A PROPÓSITO.
    # Un caché viejo puede estar mezclando versiones nuevas con viejas y rompiendo todo.

    - name: Compilar APK
      run: |
        export APP_ANDROID_ACCEPT_SDK_LICENSE=1
        buildozer android debug

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: PTT-Client-APK
        path: bin/*.apk
