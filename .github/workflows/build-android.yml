name: Build Android APK (Cliente PTT)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    # Usamos Ubuntu 22.04 porque es estable y tiene las librerías necesarias
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Instalar Buildozer y Cython (versiones fijas y estables)
      run: |
        pip3 install --user --upgrade "buildozer==1.5.0"
        pip3 install --user --upgrade "Cython==0.29.36"

    - name: Compilar APK
      run: |
        # Acepta las licencias de Android automáticamente
        export APP_ANDROID_ACCEPT_SDK_LICENSE=1
        # Añade buildozer al PATH para que el sistema lo encuentre
        export PATH="$HOME/.local/bin:$PATH"
        # El comando de compilación
        buildozer android debug

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: PTT-Client-APK
        # Busca el APK generado en la carpeta 'bin'
        path: bin/*.apk
