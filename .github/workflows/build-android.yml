name: Build Android APK (Cliente PTT)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar la versión de Python del servidor a 3.10.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Instalar Buildozer y Cython (versiones fijas)
      run: |
        pip3 install --user --upgrade "buildozer==1.5.0"
        pip3 install --user --upgrade "Cython==0.29.36"

    - name: Compilar APK
      run: |
        export APP_ANDROID_ACCEPT_SDK_LICENSE=1
        export PATH="$HOME/.local/bin:$PATH"
        buildozer android debug

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: PTT-Client-APK
        path: bin/*.apk
